workflows:
  ios-appstore:
    name: MyFertiPal iOS

    max_build_duration: 60

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default

      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.myfertipall.app

      vars:
        BUNDLE_ID: com.myfertipall.app

    cache:
      cache_paths:
        - ~/.pub-cache
        - ~/Library/Caches/CocoaPods
        - ios/Pods

    scripts:
      - name: Get packages
        script: flutter pub get

      - name: Install CocoaPods
        script: |
          cd ios
          pod install
          cd ..

      - name: Analyze
        script: flutter analyze

      - name: Build IPA
        script: |
          flutter build ipa \
            --release \
            --dart-define=YARNGPT_API_KEY=$YARNGPT_API_KEY

    artifacts:
      - build/ios/ipa/*.ipa

    publishing:
      app_store_connect:
        auth: integration

      email:
        recipients:
          - sandraofosuturkson@gmail.com