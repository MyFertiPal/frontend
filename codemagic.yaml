workflows:
  ios-release:
    name: iOS Release

    instance_type: mac_mini_m2
    max_build_duration: 120

    environment:
      flutter: stable

    cache:
      cache_paths:
        - ~/.pub-cache
        - ~/.cocoapods
        - ~/Library/Caches/CocoaPods

    scripts:
      - name: Clean project
        script: |
          flutter clean

      - name: Get Flutter packages
        script: |
          flutter pub get

      - name: Install CocoaPods
        script: |
          cd ios
          pod repo update
          pod install
          cd ..

      - name: Build iOS IPA
        script: |
          flutter build ipa --release

    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/archive/*.xcarchive