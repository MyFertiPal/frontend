name: nexus_fertility_app
description: A fertility tracking app
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  provider: ^6.1.1
  shared_preferences: ^2.2.2
  http: ^1.1.2
  audioplayers: ^5.2.1
  just_audio: ^0.9.36
  audio_session: ^0.1.21
  table_calendar: ^3.0.9
  intl: ^0.20.2
  flutter_gen: ^5.4.0
  email_validator: ^2.1.17
  path_provider: ^2.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.3.8

flutter_native_splash:
  color: "#2E7D32"  # Changed to green
  image: "assets/splash/logo.png"
  android: true
  ios: true

flutter_icons:
  android: true
  ios: true
  image_path: "assets/images/app_logo.png"
  adaptive_icon_background: "#2E7D32"  # Changed to green
  adaptive_icon_foreground: "assets/images/app_logo.png"

flutter_gen_config:
  output: lib/generated
  line_length: 80
  pubspec_config:
    enabled: true

flutter:
  uses-material-design: true
  generate: true
  
  assets:
    - assets/audio/article_1.mp3
    - assets/audio/article_2.mp3
    - assets/audio/article_3.mp3
    - assets/audio/encouragement.wav
    - assets/images/app_logo.png
    - assets/images/article_1.jpeg
    - assets/images/article_2.jpeg
    - assets/images/article_3.jpeg
    - assets/icon/
    - assets/icons/
    - assets/splash/
