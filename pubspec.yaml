name: myfertipal
description: A fertility tracking app
publish_to: "none"
version: 10.7.5+7

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  provider: ^6.1.1
  shared_preferences: ^2.2.2
  firebase_auth: ^6.0.2
  google_sign_in: ^6.2.1
  http: ^1.1.2
  audioplayers: ^5.2.1
  webview_flutter: ^4.10.0
  just_audio: ^0.9.36
  audio_session: ^0.1.21
  image_picker: ^1.1.2
  app_links: ^6.3.2
  url_launcher: ^6.3.2
  sign_in_with_apple: ^8.1.0
  table_calendar: ^3.0.9
  intl: ^0.20.2
  intl_phone_field: ^3.2.0
  flutter_gen: ^5.4.0
  email_validator: ^2.1.17
  in_app_purchase: ^3.2.3
  crypto: ^3.0.3
  path_provider: ^2.1.1
  flutter_local_notifications: ^20.0.0
  firebase_core: ^4.4.0
  firebase_messaging: ^16.1.1
  firebase_analytics: ^12.1.2
  cloud_firestore: ^6.1.2
  permission_handler: ^12.0.0
  
  
  

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.7

dependency_overrides:
  flutter_local_notifications: 20.0.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/splash/logo.png"
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "assets/splash/logo.png"

flutter_native_splash:
  color: "#ffffff"
  image: "assets/images/app_logo.png"
  android: true
  ios: true
  web: false
  android_12:
    color: "#ffffff"
    image: "assets/images/app_logo.png"
    icon_background_color: "#ffffff"

flutter_gen_config:
  output: lib/generated
  line_length: 80
  pubspec_config:
    enabled: true

flutter:
  uses-material-design: true
  generate: true
  
  assets:
    - assets/audio/article_1.mp3
    - assets/audio/article_2.mp3
    - assets/audio/article_3.mp3
    - assets/audio/en.mp3
    - assets/audio/ha.mp3
    - assets/audio/pcm.mp3
    - assets/audio/yo.mp3
    - assets/audio/ig.mp3
    - assets/bg.jpeg
    - assets/images/app_logo.png
    - assets/images/profile_placeholder.webp
    - assets/images/doctor_placeholder.png
    - assets/images/flower.png
    - assets/icons/
    - assets/splash/
    
    
